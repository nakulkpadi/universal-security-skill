# Example only. Review and pin actions to immutable commit SHAs according to your policy
# before enabling this workflow in a production repository.
name: Security baseline

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run repository security checks
        shell: bash
        run: |
          # This repository template intentionally does not install scanners here.
          # Add organization-approved, pinned scanner setup before enabling calls below.
          .github/skills/universal-security/scripts/detect-stack.sh .
