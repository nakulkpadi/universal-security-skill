name: Feature request
description: Suggest a new defensive check, framework profile, test fixture, or workflow improvement.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Security or usability problem
      description: What gap would this feature address?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed approach
      description: Include applicability, evidence, remediation and verification ideas when relevant.
    validations:
      required: true
  - type: textarea
    id: references
    attributes:
      label: References
      description: Standards, official framework docs, test cases or upstream links.
